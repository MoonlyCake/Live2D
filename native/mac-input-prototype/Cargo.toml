[package]
name = "whale-mac-input-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "=2.16.17", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "=2.16.13"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[build-dependencies]
napi-build = "=2.1.6"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
